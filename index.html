.cockpit.full .strip, .lensbar button, .dock, .key, .sheet, .gpop, #sheet { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; }
.cockpit.full .strip { background: var(--panel); border-bottom: 1px solid var(--rule); }
.strip .when { font-family: var(--body); font-weight: 600; font-size: 0.95rem; }
.inst.gauge, .inst { font-variant-numeric: tabular-nums; }
.throttle { border: 1px solid var(--rule); border-radius: 4px; }
.throttle button { min-height: 32px; font-size: 0.85rem; }
.throttle button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.home { border-radius: 4px; }
.lensbar button, .pills button { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; min-height: 28px; font-size: 0.78rem; font-weight: 500; }
.lensbar button[aria-pressed="true"], .pills button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.seg { border-radius: 2px; } .seg button { font-size: 0.82rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.step { border-radius: 2px; } .orders button, .ord, .mode, .star, button.go { border-radius: 4px; }
.sheet, .gpop, .key { border-radius: 4px; background: var(--panel); border: 1px solid var(--rule); }
.cockpit.full #sheet { border-radius: 4px; }
.dock { background: var(--panel); border-top: 1px solid var(--rule); border-radius: 0; }
.dock .tabs button { font-size: 0.82rem; font-weight: 500; border-top: 1.5px solid transparent; }
.dock .tabs button[aria-pressed="true"] { border-top: 1.5px solid var(--ink); font-weight: 600; }
.flash-good, .flash-bad, .flash-warn { animation-duration: 0.6s; }
