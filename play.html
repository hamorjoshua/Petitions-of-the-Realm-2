/* The cockpit: one screen tall, no page scroll. Instruments on top, the view in the middle, the controls under the thumb. */

.strip .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.strip .row.inst4 { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.strip .inst .gilt { font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.strip .seals .seal { width: 13px; height: 13px; }
.inst { display: flex; flex-direction: column; line-height: 1.15; font-size: 0.9rem; }
.inst .label { font-size: 0.65rem; }
.inst.gauge { font: inherit; font-size: 0.9rem; color: var(--ink); background: none; border: 0; padding: 2px 4px; margin: -2px -4px; text-align: left; cursor: pointer; border-radius: 6px; min-width: 0; }
.inst.gauge[aria-expanded="true"] { background: color-mix(in srgb, var(--woad) 14%, transparent); }
.up { color: var(--good); font-weight: 700; } .down { color: var(--seal); font-weight: 700; }
.inst .label b { font-size: 0.7rem; }
.flash-good { animation: fgood 0.9s ease-out; } .flash-bad { animation: fbad 0.9s ease-out; } .flash-warn { animation: fwarn 0.9s ease-out; }
@keyframes fgood { 0%, 40% { background: color-mix(in srgb, var(--good) 35%, transparent); } }
@keyframes fbad { 0%, 40% { background: color-mix(in srgb, var(--seal) 35%, transparent); } }
@keyframes fwarn { 0%, 40% { background: color-mix(in srgb, var(--gilt) 35%, transparent); } }
@media (prefers-reduced-motion: reduce) { .flash-good, .flash-bad, .flash-warn { animation-duration: 0.01s; } }
.gpop { background: var(--cloth); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; margin-top: 2px; }
.gpop .bar button { border: 0; background: none; color: var(--soft); min-height: 30px; cursor: pointer; font-size: 0.95rem; }
.gpop .list li { padding: 2px 0; }
.home { font: inherit; border: 1px solid var(--rule); border-radius: 6px; background: none; color: var(--soft); min-height: 28px; min-width: 30px; cursor: pointer; vertical-align: middle; }
.inst.warn span:last-child { color: var(--gilt); font-weight: 600; } .inst.bad span:last-child { color: var(--seal); font-weight: 600; }
.warn { color: var(--gilt); } .bad { color: var(--seal); } .good { color: var(--good); }
.strip .when { font-family: var(--display); font-size: 1rem; min-width: 0; line-height: 1.2; }
.throttle { flex: none; }
.throttle { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.throttle button, .seg button, .pills button, .tabs.vt button, .deck .tabs button, .step button { font: inherit; border: 0; background: transparent; color: var(--ink); cursor: pointer; min-height: 36px; padding: 0 10px; }
.throttle button[aria-pressed="true"], .seg button[aria-pressed="true"], .pills button[aria-pressed="true"] { background: var(--woad); color: var(--woad-ink); }
.tabs.vt, .deck .tabs { display: flex; flex: none; border-bottom: 1px solid var(--rule); background: var(--panel); margin: 0; gap: 0; }
.tabs.vt button, .deck .tabs button { flex: 1; min-height: 40px; border-bottom: 2px solid transparent; border-radius: 0; }
.tabs.vt button[aria-pressed="true"], .deck .tabs button[aria-pressed="true"] { border-bottom-color: var(--woad); font-weight: 600; background: transparent; color: var(--ink); }
#badge:not(:empty) { display: inline-block; min-width: 1.4em; padding: 0 4px; border-radius: 999px; background: var(--seal); color: #fff; font-size: 0.75rem; margin-left: 4px; }

.map-viewport .reset { position: absolute; top: 6px; right: 6px; z-index: 2; font: inherit; font-size: 0.8rem; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); color: var(--ink); min-height: 30px; padding: 0 10px; cursor: pointer; }
.legend { margin-top: -4px; } .legend summary { list-style: none; cursor: pointer; } .legend summary::-webkit-details-marker { display: none; } .keylink { color: var(--woad); text-decoration: underline; margin-left: 4px; }
.map .cell { background: color-mix(in srgb, var(--c) var(--v), color-mix(in srgb, var(--soft) var(--h, 0%), var(--panel))) !important; aspect-ratio: 1; border: 0; padding: 0; border-radius: 3px; cursor: pointer; position: relative; background: color-mix(in srgb, var(--c) var(--v), var(--panel)); color: var(--ink); font-size: 0.6rem; display: grid; place-items: center; min-width: 0; }
