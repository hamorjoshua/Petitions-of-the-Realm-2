.cockpit.full .strip, .lensbar button, .dock, .key, .sheet, .gpop, #sheet { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; }
.cockpit.full .strip { background: var(--panel); border-bottom: 1px solid var(--rule); }
.strip .when { font-family: var(--body); font-weight: 600; font-size: 0.95rem; }
.inst.gauge, .inst { font-variant-numeric: tabular-nums; }
.throttle { border: 1px solid var(--rule); border-radius: 4px; }
.throttle button { min-height: 32px; font-size: 0.85rem; }
.throttle button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.home { border-radius: 4px; }

.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

.sheet, .gpop, .key { border-radius: 4px; background: var(--panel); border: 1px solid var(--rule); }
.cockpit.full #sheet { border-radius: 4px; }
.dock { background: var(--panel); border-top: 1px solid var(--rule); border-radius: 0; }
.flash-good, .flash-bad, .flash-warn { animation-duration: 0.6s; }

/* A survey sheet: a faint grid of crosses across the sea. */
.cockpit.full { background-color: var(--sea); background-image: radial-gradient(circle, color-mix(in srgb, var(--soft) 30%, transparent) 0.9px, transparent 1.3px); background-size: 18px 18px; background-repeat: repeat; }
.map .labels text.sub { font-size: 0.11px; font-weight: 500; text-transform: none; letter-spacing: 0.02em; fill: var(--soft); font-variant-numeric: tabular-nums; }
#legend { position: fixed; left: 12px; bottom: calc(52px + env(safe-area-inset-bottom, 0px) + 10px); z-index: 4; pointer-events: none; }
.legend-scale { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--soft); }

.legend-scale .small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11px; }
.dock .tabs button { position: relative; flex: 1; min-height: 44px; padding: 0 2px; border: 0; border-top: 2px solid transparent; background: none; color: var(--soft); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }

.dock .tabs button.alert::after { content: ""; position: absolute; top: 7px; left: calc(50% + 8px); width: 6px; height: 6px; border-radius: 50%; background: var(--seal); }

/* The Braun pass: warm panels, recessed tracks, woad for what is active, 3px corners, 44px targets, hairlines only. */
button, input { border-radius: 3px; }
.cockpit.full .strip, .dock { border-radius: 0 !important; }
.throttle, .seg, .lensseg { background: var(--recess); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; display: flex; }
.throttle button, .seg button, .lensseg button { min-height: 44px; border: 0; border-left: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 0; font: inherit; font-size: 0.82rem; font-weight: 500; cursor: pointer; }
.throttle button:first-child, .seg button:first-child, .lensseg button:first-child { border-left: 0; }
.throttle button[aria-pressed="true"], .seg button[aria-pressed="true"], .lensseg button[aria-pressed="true"] { background: var(--woad); color: #fff; }
.throttle button { min-width: 44px; }
.lensseg { pointer-events: auto; width: 100%; } .lensseg button { flex: 1; padding: 0 4px; min-width: 0; }
#lensbar { position: relative; padding: 8px 12px 0; }
.tools { position: absolute; right: 12px; top: calc(100% + 8px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; pointer-events: auto; }
.tools button { min-width: 44px; min-height: 44px; border: 0; border-top: 1px solid var(--rule); background: transparent; color: var(--ink); font: inherit; font-size: 0.8rem; font-weight: 600; border-radius: 0; cursor: pointer; }
.tools button:first-child { border-top: 0; } .tools button[aria-pressed="true"] { background: var(--woad); color: #fff; }
.key { position: absolute; right: 64px; top: calc(100% + 8px); left: 12px; margin: 0; border-radius: 3px; }
.orders button, .step button, .ord, button.go, .mode, .home { min-height: 44px; border-radius: 3px; }
.step { background: var(--recess); border: 1px solid var(--rule); border-radius: 3px; }
.sheet, .gpop, .key, .legend-scale, .cockpit.full #sheet { border-radius: 3px; box-shadow: none; }
#legend { bottom: calc(52px + env(safe-area-inset-bottom, 0px) + 8px); }
.up { color: var(--good); } .down { color: var(--seal); }
.map .coast { stroke: var(--coast); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.map .regions polygon.wild { fill: var(--wild); } .map .regions polygon.wild2 { fill: var(--wild2); } .map .regions polygon.wild3 { fill: var(--wild3); }
.map .t-lord { fill: var(--ink); } .map .t-parish { fill: var(--panel); stroke: var(--gilt); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.map .t-crown { fill: var(--gilt); } .map .t-watchdot { fill: var(--woad); }
.map .t-alarm { stroke-width: 1.2px; }
.map .labels text { letter-spacing: 0.09em; }
.cockpit.full { background-image: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0.9px, transparent 1.3px); }

/* Editorial pass: a serif for titles and the chronicle, a grotesque for everything else, figures in columns. */
body { background: var(--bg); font-size: 13px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: 0; }
.label, .inst .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--soft); }
button, input { font-size: 13px; }
/* Landing */
.landing { max-width: 34rem; gap: 16px; padding-top: 32px; }
.masthead { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 14px 0 12px; }
.masthead h1 { font-size: 22px; } .masthead p { color: var(--soft); margin-top: 2px; }
.moderows { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.moderow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 12px 2px; color: var(--ink); cursor: pointer; border-radius: 0; min-height: 44px; }
.moderow span { flex: 1; display: flex; flex-direction: column; gap: 2px; } .moderow strong { font-family: var(--display); font-size: 16px; font-weight: 600; } .moderow small { color: var(--soft); font-size: 12px; }
.moderow[aria-pressed] { background: none; color: var(--ink); border-color: var(--rule); }
.moderow i { font-style: normal; color: var(--soft); } .moderow[aria-pressed="true"] strong { color: var(--blue); } .moderow[aria-pressed="true"] i { color: var(--blue); }
.moderow.resume { border-top: 1px solid var(--rule); } .moderow.resume strong { color: var(--blue); }
.seedrow { display: flex; align-items: center; gap: 8px; } .seedrow input { width: 6rem; min-height: 36px; border: 1px solid var(--rule); background: var(--panel); padding: 0 8px; border-radius: 2px; font-variant-numeric: tabular-nums; }
.seedrow button { min-height: 36px; padding: 0 12px; border: 1px solid var(--ink); background: var(--panel); color: var(--ink); border-radius: 2px; cursor: pointer; font-weight: 500; } .seedrow button.go { background: var(--ink); color: var(--panel); }
/* Strip: four figures with bars, then the toolbar */
.cockpit.full { background: var(--bg) !important; background-image: none !important; }
.cockpit.full .strip { background: var(--panel); border-bottom: 1px solid var(--rule); padding: 8px 12px 0; gap: 0; }
.kpis { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 0.7fr) minmax(0, 0.6fr) minmax(0, 1.5fr); gap: 12px; }
.kpi { display: flex; flex-direction: column; gap: 2px; text-align: left; background: none; border: 0; padding: 0; color: var(--ink); font: inherit; cursor: pointer; min-width: 0; border-radius: 0; }
div.kpi { cursor: default; }
.kpi .val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .bar { height: 2px; background: var(--rule); display: block; margin-top: 2px; } .kpi .bar i { display: block; height: 100%; background: var(--ink); } .kpi .bar i.bad { background: var(--red); }
.kpi[aria-expanded="true"] .label { color: var(--blue); }
.toolbar { height: 34px; display: flex; align-items: center; gap: 10px; }
.toolbar .when { font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 500; color: var(--ink); font-family: var(--body); flex: 1; }
.toolbar .home { min-height: 28px; min-width: 28px; padding: 0; border: 0; background: none; color: var(--soft); font-size: 14px; }
.speeds { display: flex; gap: 2px; } .speeds button { border: 0; background: none; color: var(--soft); min-height: 30px; min-width: 32px; padding: 0 4px; font-variant-numeric: tabular-nums; cursor: pointer; border-radius: 2px; }
.speeds button[aria-pressed="true"] { color: var(--blue); font-weight: 700; }
/* Lens tabs */
#lensbar { padding: 0; background: var(--panel); border-bottom: 1px solid var(--rule); max-width: 44rem; pointer-events: auto; }
.lenstabs { display: flex; height: 30px; align-items: stretch; padding: 0 8px; }
.lenstabs button { border: 0; background: none; color: var(--soft); font-size: 12px; padding: 0 8px; border-bottom: 2px solid transparent; border-radius: 0; cursor: pointer; }
.lenstabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; background: none; }
.lenstabs .spacer { flex: 1; } .lenstabs .tlink { color: var(--soft); border-bottom: 0; padding: 0 6px; } .lenstabs .tlink[aria-pressed="true"] { color: var(--blue); border-bottom: 0; }
.key { position: static; margin: 0; border: 0; border-top: 1px solid var(--rule); border-radius: 0; background: var(--panel); padding: 8px 12px; }
/* Map */
.map .regions polygon { fill: var(--stone); stroke: var(--bg); stroke-width: 0.75px; vector-effect: non-scaling-stroke; }
.map .regions polygon.water { fill: transparent; stroke: none; }
.map .regions polygon.on { stroke: var(--blue); stroke-width: 2px; }
.map .coast { stroke: var(--soft); stroke-width: 0.75px; opacity: 0.6; }
.map .borders path { stroke: var(--ink); stroke-width: 1px; opacity: 0.7; }
.map .roads { stroke: var(--soft); stroke-width: 0.75px; opacity: 0.35; }
.map .t-dot { fill: var(--ink); } .map .t-seat { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.map .labels text { font-family: var(--body); font-size: 0.17px; font-weight: 500; text-transform: none; letter-spacing: 0; dominant-baseline: hanging; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 0.045px; stroke-linejoin: round; opacity: 1; }
.map .labels .fig { fill: var(--soft); font-weight: 400; font-variant-numeric: tabular-nums; }
/* Dock and sheets */
.dock { background: var(--panel); border-top: 1px solid var(--rule); }
.dock.open { border-top: 1px solid var(--ink); }
.dock .half { padding: 0 12px; gap: 0; } .dock.open .half { padding: 4px 12px 8px; }
.dock .half > .label { padding: 12px 0 4px; }
.dial, .law.row, .ord, .power { border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: none; padding: 10px 0; margin: 0; }
.dial strong, .law strong, .ord strong, .power strong { font-size: 13px; font-weight: 600; }
.dial .small, .law .small { font-size: 11px; }
.step { background: none; border: 1px solid var(--rule); border-radius: 2px; } .step button { min-height: 28px; min-width: 28px; font-size: 14px; border-radius: 0; } .step span { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 5em; }
.law.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.law.row > .hint { grid-column: 1 / -1 !important; grid-row: 2; line-height: 1.35; } .law.row .lname { grid-column: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 0; } .law.row .lname .small { margin-left: 0; } .law.row > .small { grid-column: 1; } .law.row .seg { grid-column: 2; grid-row: 1; }
.law .seg { background: none; border: 1px solid var(--rule); border-radius: 2px; } .law .seg button { min-height: 26px; font-size: 11px; padding: 0 7px; flex: none; }
.law .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.ord { display: flex; flex-direction: column; gap: 2px; }
.orders { display: flex; flex-wrap: wrap; gap: 6px; }
.orders button { min-height: 28px; border: 1px solid var(--ink); background: none; color: var(--ink); border-radius: 2px; font-size: 12px; padding: 2px 8px; text-align: center; }
.orders button:disabled { border-color: var(--rule); color: var(--soft); }
progress.amb, .ord progress { height: 3px; appearance: none; -webkit-appearance: none; border: 0; background: var(--rule); }
progress.amb::-webkit-progress-bar, .ord progress::-webkit-progress-bar { background: var(--rule); } progress.amb::-webkit-progress-value, .ord progress::-webkit-progress-value { background: var(--ink); } progress.amb.over::-webkit-progress-value { background: var(--red); }
.list.chron li { font-family: var(--display); font-size: 14px; line-height: 1.45; border-bottom: 1px solid var(--rule); padding: 8px 0 8px 10px; border-left: 2px solid transparent; }
.list.chron li .label { font-family: var(--body); margin-right: 4px; } .list.chron li .small { font-family: var(--body); }
.list.chron li.major { border-left-color: var(--red); } .list.chron li.era { border-left-color: var(--amber); background: none; } .list.chron li.watch { border-left-color: var(--blue); }
/* The place inspector */
.cockpit.full #sheet { border-radius: 0; left: 0; right: 0; max-width: 44rem; bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
.sheet.inspector { border: 0; border-top: 1.5px solid var(--ink); border-radius: 0; background: var(--panel); padding: 10px 14px 12px; gap: 8px; }
.inspector h3 { font-family: var(--display); font-size: 18px; display: flex; align-items: center; gap: 4px; }
.inspector .x { border: 0; background: none; color: var(--soft); min-width: 32px; min-height: 32px; }
.pk { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; } .pk b { color: var(--ink); font-weight: 700; }
.alinks { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.alink { border: 0; background: none; color: var(--blue); font-weight: 600; font-size: 13px; padding: 4px 0; min-height: 28px; cursor: pointer; border-radius: 0; display: inline-flex; gap: 4px; align-items: baseline; }
.alink small { color: var(--soft); font-weight: 400; font-size: 11px; } .alink:disabled { color: var(--soft); font-weight: 500; cursor: default; }
.alinks.build { border-top: 1px solid var(--rule); padding-top: 6px; } .alinks.build .label { margin-right: -4px; }
.houses { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.houses li { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--rule); font-size: 12px; } .houses li span:nth-child(2) { flex: 1; }
#legend .legend-scale { background: var(--panel); border: 1px solid var(--rule); border-radius: 2px; } #legend { bottom: calc(48px + env(safe-area-inset-bottom, 0px) + 8px); }
.gpop { background: var(--panel); border: 0; border-top: 1px solid var(--rule); border-radius: 0; margin: 0 -12px; padding: 8px 12px; }

/* The Chancery: a printed atlas and ledger. Book serif for names and the chronicle, a small sans for labels and controls. */
.cockpit.full .strip { border-bottom: 0; padding-bottom: 4px; background:
  linear-gradient(var(--ink), var(--ink)) left bottom / 100% 1px no-repeat,
  linear-gradient(var(--ink), var(--ink)) left calc(100% - 3px) / 100% 2px no-repeat, var(--panel); }
.kpi .val { font-family: var(--ui); }
.map .regions rect[data-cell] { fill: var(--stone); stroke: var(--bg); stroke-width: 0.5px; vector-effect: non-scaling-stroke; cursor: pointer; }
.map .regions rect[data-cell].water { fill: var(--water); stroke: var(--water); }
.map .regions rect[data-cell].on { stroke: var(--blue); stroke-width: 2px; }
.map .coast { fill: none; stroke: var(--soft); stroke-width: 1.25px; vector-effect: non-scaling-stroke; stroke-linecap: square; opacity: 1; }
.map .borders { fill: none; stroke: var(--ink); stroke-width: 1.5px; vector-effect: non-scaling-stroke; stroke-linecap: square; }
.map .t-dot { fill: var(--ink); }
.map .t-seat { fill: var(--bg); stroke: var(--amber); stroke-width: 2px; vector-effect: non-scaling-stroke; }
.map .labels text { font-family: var(--display); font-size: 0.18px; font-weight: 400; letter-spacing: 0.01em; text-anchor: middle; dominant-baseline: hanging; fill: var(--ink); paint-order: stroke; stroke: var(--stone); stroke-width: 0.045px; }
.map .labels .fig { font-style: italic; fill: var(--soft); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--rule); padding: 10px 0; }
.row strong { font-size: 13px; font-weight: 600; }
.list.chron li, .inspector h3, .moderow strong, .masthead h1 { font-family: var(--display); }
.dock .half p.small { font-size: 12px; line-height: 1.4; margin: 4px 0 8px; }

/* The atlas plate (from the seasonal atlas): a title with one figure, the map in its own field, the scale beneath. */
.cockpit.full { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; background: var(--panel) !important; }
.cockpit.full .hud-top { position: relative; grid-row: 1; }
.cockpit.full .map-host { position: relative; grid-row: 2; min-height: 0; container-type: size; background: var(--map-water); border-bottom: 1px solid var(--rule); }
.cockpit.full .map { width: min(100cqw, 100cqh); }
.cockpit.full #legend { position: static; grid-row: 3; background: var(--panel); pointer-events: auto; }
.measure-key { box-sizing: border-box; padding: 8px 14px 10px; color: var(--ink); }
.measure-unit { font: 600 10px var(--ui); text-transform: uppercase; letter-spacing: 0.08em; color: var(--soft); }
.measure-bands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin: 6px 0 2px; font: 11px/1.4 var(--ui); font-variant-numeric: tabular-nums; color: var(--soft); }
.measure-bands i { display: block; height: 8px; border: 1px solid var(--rule); }
.measure-key small { font-size: 11px; color: var(--soft); } .measure-key small i { display: inline-block; width: 10px; height: 8px; background: var(--unsettled); margin-right: 5px; vertical-align: -1px; }
.measure-key small.interdict i { background: var(--red); }
/* The seasons tint the map's stock: ground, water, and open unsettled land. */
.cockpit[data-season="Winter"] { --map-water: #cfdee5; --map-ground: #f3f6f4; --map-open: #c8cfcf; }
.cockpit[data-season="Spring"] { --map-water: #cddfd6; --map-ground: #f2f4e2; --map-open: #c6d0b0; }
.cockpit[data-season="Summer"] { --map-water: #d4e3df; --map-ground: #f7f0dc; --map-open: #d8cba1; }
.cockpit[data-season="Autumn"] { --map-water: #dbd8d1; --map-ground: #f6ecdc; --map-open: #d4bea5; }
.cockpit.full .map, #legend { --stone: var(--map-ground, #eae3d5); --unsettled: var(--map-open, #d8d0bf); }
.map .regions rect[data-cell].water { fill: var(--map-water, var(--water)); stroke: none; }
.map .coast { stroke: #355465; stroke-width: 1.5px; }
.map .terrain { pointer-events: none; opacity: 0.22; color: #33474a; }
.map .t-rank { fill: var(--ink); }
.map .labels text { stroke: var(--map-ground, var(--stone)); stroke-width: 0.25em; paint-order: stroke; }
.cockpit.full .dock { left: 0; right: 0; }
.map .regions rect.tile { stroke: rgba(28,25,21,.14); stroke-width: .5px; cursor: pointer; }
.map .tile, .map .bevel, .map .tile-borders, .map .grief-frame, .map .tile-choice { vector-effect: non-scaling-stroke; }
.map .engraving, .map .tile-borders { pointer-events: none; }
.map .bevel { stroke: rgba(28,25,21,.22); stroke-width: 1.5px; }
.map .tile-borders { fill: none; stroke: var(--ink); stroke-width: 1.5px; }
.map .grief-frame { fill: none; stroke: #ad422b; stroke-width: 1px; }
.map .regions, .map .borders, .map svg > .tokens { transition: opacity 180ms; }
.map.focused .regions, .map.focused .borders, .map.focused svg > .tokens { opacity: .52; }
@starting-style {
  .map.focused .regions, .map.focused .borders, .map.focused svg > .tokens { opacity: 1; }
}
.socket { fill: rgba(28,25,21,.18); }
.lift-shadow { fill: rgba(28,25,21,.22); pointer-events: none; }
.tile-edge { fill: #766c5b; pointer-events: none; }
.map .lifted { transform-box: view-box; transform: translateY(-.22px) scale(1.16); }
.map .lifted .tile { stroke: rgba(28,25,21,.35); stroke-width: 1px; cursor: pointer; }
.cockpit.full #sheet.anchored {
  top: var(--card-top); bottom: auto; height: auto;
  left: max(12px, calc(var(--card-center) - 13rem)); right: max(12px, calc(100% - var(--card-center) - 13rem));
  max-width: 26rem; width: auto; margin: 0 auto; overflow: visible;
  --card-limit: calc(100dvh - var(--card-top) - var(--dock-height) - 16px);
  max-height: var(--card-limit); box-sizing: border-box; background: var(--panel);
  border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 10px 26px rgba(28,25,21,.14) !important;
}
#sheet.anchored::before { content: ""; position: absolute; left: 50%; top: -6px; width: 10px; height: 10px; transform: translateX(-50%) rotate(45deg); background: var(--panel); border: solid var(--rule); border-width: 1px 0 0 1px; }
#sheet.anchored .inspector { position: relative; border: 0; border-radius: 5px; box-sizing: border-box; max-height: calc(var(--card-limit) - 2px); overflow-y: auto; }
.cockpit.full .strip { padding: 1px 8px 3px; }
.toolbar { height: 26px; gap: 5px; }
.toolbar .home, .speeds button { min-height: 24px; }
.speeds button { background: transparent; border: 0; }
.kpis { grid-template-columns: .85fr .55fr 1.25fr auto; align-items: center; gap: clamp(3px,1vw,12px); }
.kpis .kpi { gap: 0; min-height: 0; }
.kpis .label { font-size: 9px; line-height: 12px; letter-spacing: .03em; }
.kpis .val { font-size: 13px; line-height: 16px; }
.kpis .bar { width: 100%; margin: 0; }
.piece-tray { display: flex; border-left: 1px solid var(--rule); padding-left: 3px; }
.piece-tray button { display: grid; place-items: center; min-height: 30px; width: clamp(16px,5vw,27px); border: 0; background: none; padding: 0; }
.clerk-piece { width: 21px; height: 21px; max-width: 100%; vertical-align: middle; }
.meeple { pointer-events: none; }
.piece-tray .deployed .meeple path { fill: none; stroke: var(--ink); stroke-width: .8px; stroke-dasharray: 2 1; vector-effect: non-scaling-stroke; }
.piece-tray .deployed .meeple ellipse, .piece-tray .deployed .meeple path:first-of-type { display: none; }
.cockpit.full #lensbar { max-width: none; }
.lenstabs { height: 36px; padding: 0 4px; align-items: center; }
.lenstabs button { height: 36px; min-height: 0; padding: 0 clamp(2px,1vw,10px); font-size: clamp(10px,3vw,12px); }
#lens-stat { margin-left: auto; white-space: nowrap; padding-inline: 3px; font: 500 clamp(12px,3.4vw,18px)/1 var(--display); font-variant-numeric: tabular-nums; }
.lenstabs .tlink { padding: 0 3px; }
.office-board, .regional-sockets { display: grid; gap: 6px; }
.office-board { grid-template-columns: repeat(2,minmax(0,1fr)); padding-block: 6px; }
.office-space { border: 1px solid var(--rule); border-radius: 4px; padding: 10px; background: var(--panel); display: grid; grid-template-rows: auto auto 28px; gap: 3px; }
.office-space strong { font-size: 13px; line-height: 1.1; }
.office-space small { font-size: clamp(10px,2.65vw,12px); color: var(--soft); }
button.action-socket { min-height: 28px; width: 28px; height: 28px; padding: 0; display: grid; place-items: center; border: 1px solid var(--rule); border-radius: 50%; background: var(--stone); box-shadow: inset 0 1px 0 var(--rule); justify-self: end; }
.regional-sockets { grid-template-columns: repeat(3,minmax(0,1fr)); border-bottom: 1px solid var(--rule); padding-block: 5px 8px; }
.regional-sockets > div { display: grid; justify-items: center; gap: 3px; font-size: 11px; }
.regional-sockets .action-socket { justify-self: center; }
.inscribe-row, .statute-group summary { padding: 7px 0; border-top: 1px solid var(--rule); }
.inscribe-row { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.inscribe-row select { flex: 1; min-width: 0; }
.statute-group { flex: none; }
.statute-group summary { cursor: pointer; font-weight: 600; }
.statute-group summary small { float: right; color: var(--soft); font-weight: 500; border: 1px solid var(--rule); border-radius: 3px; padding: 1px 5px; }
</style>
